<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boutique INF349</title>
<style>
  :root {
    --bg: #fbfaf7;
    --ink: #18181b;
    --muted: #71717a;
    --line: #e7e5e0;
    --card: #ffffff;
    --accent: #1d4ed8;
    --accent-soft: #eef2ff;
    --ok: #15803d;
    --err: #b91c1c;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.6rem;
    background: rgba(251,250,247,.85);
    backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; font-size: 1.25rem; letter-spacing: -.02em; }
  .brand span { color: var(--accent); }
  .cart-btn {
    position: relative; border: 1px solid var(--line); background: var(--card);
    border-radius: 999px; padding: .55rem 1.1rem; cursor: pointer;
    font-size: .9rem; font-weight: 600; display: flex; align-items: center; gap: .5rem;
    transition: border-color .15s, transform .1s;
  }
  .cart-btn:hover { border-color: var(--accent); }
  .cart-btn:active { transform: scale(.97); }
  .cart-count {
    background: var(--accent); color: #fff; border-radius: 999px;
    min-width: 1.3rem; height: 1.3rem; padding: 0 .35rem;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: .75rem; font-weight: 700;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.6rem 5rem; }
  .hero { margin-bottom: 2.5rem; }
  .hero h1 { font-size: 2.4rem; letter-spacing: -.03em; margin: 0 0 .4rem; }
  .hero p { color: var(--muted); margin: 0; font-size: 1.05rem; }
  .grid {
    display: grid; gap: 1.4rem;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  }
  .product {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 1.3rem; display: flex; flex-direction: column;
    transition: transform .15s, box-shadow .15s;
  }
  .product:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
  .product .thumb {
    aspect-ratio: 4/3; border-radius: 10px; margin-bottom: 1rem;
    background: linear-gradient(135deg, #f1f5f9, #e2e8f0);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.2rem; color: #94a3b8;
  }
  .product h3 { margin: 0 0 .25rem; font-size: 1.05rem; letter-spacing: -.01em; }
  .product .desc { color: var(--muted); font-size: .85rem; margin: 0 0 .9rem; flex: 1; line-height: 1.45; }
  .product .price { font-size: 1.25rem; font-weight: 700; margin-bottom: .9rem; }
  .product .meta { color: var(--muted); font-size: .78rem; font-weight: 500; }
  .stock { font-size: .75rem; font-weight: 600; padding: .2rem .55rem; border-radius: 999px; display: inline-block; margin-bottom: .9rem; }
  .stock.in { background: #f0fdf4; color: var(--ok); }
  .stock.out { background: #fef2f2; color: var(--err); }
  .qty-row { display: flex; align-items: center; gap: .6rem; }
  .stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .stepper button {
    width: 2.1rem; height: 2.1rem; border: none; background: var(--card); cursor: pointer;
    font-size: 1.1rem; color: var(--ink); transition: background .12s;
  }
  .stepper button:hover { background: var(--accent-soft); }
  .stepper input {
    width: 2.6rem; text-align: center; border: none; font-size: .95rem; font-weight: 600;
    border-left: 1px solid var(--line); border-right: 1px solid var(--line); height: 2.1rem;
  }
  .add-btn {
    flex: 1; border: none; background: var(--ink); color: #fff; border-radius: 10px;
    padding: .6rem; font-weight: 600; font-size: .9rem; cursor: pointer; transition: background .15s;
  }
  .add-btn:hover { background: var(--accent); }
  .add-btn:disabled { background: #d4d4d8; cursor: not-allowed; }

  /* Panier latéral */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 80; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: min(420px, 100%);
    background: var(--bg); z-index: 90; transform: translateX(100%);
    transition: transform .3s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column;
    box-shadow: -10px 0 40px rgba(0,0,0,.12);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 1.3rem 1.5rem; border-bottom: 1px solid var(--line); }
  .drawer-head h2 { margin: 0; font-size: 1.2rem; }
  .close { border: none; background: none; font-size: 1.5rem; cursor: pointer; color: var(--muted); line-height: 1; }
  .cart-items { flex: 1; overflow-y: auto; padding: 1rem 1.5rem; }
  .empty { color: var(--muted); text-align: center; margin-top: 3rem; font-size: .95rem; }
  .ci {
    display: flex; gap: .9rem; padding: .9rem 0; border-bottom: 1px solid var(--line); align-items: center;
  }
  .ci .ci-thumb { width: 48px; height: 48px; border-radius: 8px; background: linear-gradient(135deg,#f1f5f9,#e2e8f0); display:flex; align-items:center; justify-content:center; color:#94a3b8; flex-shrink: 0; }
  .ci-info { flex: 1; min-width: 0; }
  .ci-info .n { font-weight: 600; font-size: .9rem; }
  .ci-info .p { color: var(--muted); font-size: .8rem; }
  .ci-remove { border: none; background: none; color: var(--err); cursor: pointer; font-size: .8rem; }
  .drawer-foot { padding: 1.3rem 1.5rem; border-top: 1px solid var(--line); }
  .totals { display: flex; justify-content: space-between; margin-bottom: 1rem; font-weight: 700; font-size: 1.1rem; }
  .checkout {
    width: 100%; border: none; background: var(--accent); color: #fff; padding: .9rem;
    border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity .15s;
  }
  .checkout:hover { opacity: .9; }
  .checkout:disabled { background: #d4d4d8; cursor: not-allowed; }
  .result { margin-top: 1rem; font-size: .85rem; }
  .result a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .result .line { padding: .4rem 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: .5rem; }
  .result .ok { color: var(--ok); }
  .result .ko { color: var(--err); }
  .toast {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(200%);
    background: var(--ink); color: #fff; padding: .8rem 1.4rem; border-radius: 999px;
    font-size: .9rem; font-weight: 600; z-index: 100; transition: transform .3s;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <div class="brand">Épicerie<span>349</span></div>
  <button class="cart-btn" onclick="openCart()">
    Panier <span class="cart-count" id="count">0</span>
  </button>
</header>

<main>
  <div class="hero">
    <h1>Catalogue</h1>
    <p>Choisissez vos produits, ajustez les quantités et passez commande.</p>
  </div>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="overlay" onclick="closeCart()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h2>Votre panier</h2>
    <button class="close" onclick="closeCart()">&times;</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="drawer-foot">
    <div class="totals"><span>Total</span><span id="cartTotal">0.00</span></div>
    <button class="checkout" id="checkoutBtn" onclick="checkout()">Passer la commande</button>
    <div class="result" id="result"></div>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script>
  let products = [];
  let cart = {}; // { productId: quantity }

  async function loadProducts() {
    const r = await fetch("/");
    const data = await r.json();
    products = data.products;
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    products.forEach(p => {
      const card = document.createElement("div");
      card.className = "product";
      card.innerHTML = `
        <div class="thumb">🛒</div>
        <span class="stock ${p.in_stock ? "in" : "out"}">${p.in_stock ? "En stock" : "Rupture"}</span>
        <h3>${p.name}</h3>
        <p class="desc">${p.description || ""}</p>
        <div class="price">${formatPrice(p.price)}</div>
        <div class="meta" style="margin-bottom:.9rem">Poids : ${p.weight} g</div>
        <div class="qty-row">
          <div class="stepper">
            <button onclick="bump(${p.id}, -1)">−</button>
            <input id="q-${p.id}" value="1" inputmode="numeric" onchange="sanitize(${p.id})">
            <button onclick="bump(${p.id}, 1)">+</button>
          </div>
          <button class="add-btn" ${p.in_stock ? "" : "disabled"} onclick="addToCart(${p.id})">
            ${p.in_stock ? "Ajouter" : "Indisponible"}
          </button>
        </div>`;
      grid.appendChild(card);
    });
  }

  function formatPrice(v) {
    return Number(v).toFixed(2) + " $";
  }

  function bump(id, delta) {
    const inp = document.getElementById("q-" + id);
    let v = parseInt(inp.value, 10) || 1;
    v = Math.max(1, v + delta);
    inp.value = v;
  }
  function sanitize(id) {
    const inp = document.getElementById("q-" + id);
    let v = parseInt(inp.value, 10);
    if (isNaN(v) || v < 1) v = 1;
    inp.value = v;
  }

  function addToCart(id) {
    const qty = parseInt(document.getElementById("q-" + id).value, 10) || 1;
    cart[id] = (cart[id] || 0) + qty;
    renderCart();
    showToast("Ajouté au panier");
  }

  function removeFromCart(id) {
    delete cart[id];
    renderCart();
  }

  function cartTotal() {
    return Object.entries(cart).reduce((sum, [id, qty]) => {
      const p = products.find(x => x.id == id);
      return sum + (p ? p.price * qty : 0);
    }, 0);
  }

  function renderCart() {
    const ids = Object.keys(cart);
    const count = ids.reduce((s, id) => s + cart[id], 0);
    document.getElementById("count").textContent = count;
    document.getElementById("cartTotal").textContent = formatPrice(cartTotal());

    const box = document.getElementById("cartItems");
    if (ids.length === 0) {
      box.innerHTML = `<div class="empty">Votre panier est vide.</div>`;
      document.getElementById("checkoutBtn").disabled = true;
      return;
    }
    document.getElementById("checkoutBtn").disabled = false;
    box.innerHTML = "";
    ids.forEach(id => {
      const p = products.find(x => x.id == id);
      if (!p) return;
      const row = document.createElement("div");
      row.className = "ci";
      row.innerHTML = `
        <div class="ci-thumb">🛒</div>
        <div class="ci-info">
          <div class="n">${p.name}</div>
          <div class="p">${cart[id]} × ${formatPrice(p.price)} = ${formatPrice(p.price * cart[id])}</div>
        </div>
        <button class="ci-remove" onclick="removeFromCart(${id})">Retirer</button>`;
      box.appendChild(row);
    });
  }

  function openCart() { document.getElementById("drawer").classList.add("open"); document.getElementById("overlay").classList.add("open"); }
  function closeCart() { document.getElementById("drawer").classList.remove("open"); document.getElementById("overlay").classList.remove("open"); }

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  // L'API n'accepte qu'un produit par commande : on crée donc une commande
  // par article du panier, puis on affiche le lien de chaque commande.
  async function checkout() {
    const btn = document.getElementById("checkoutBtn");
    const result = document.getElementById("result");
    btn.disabled = true;
    btn.textContent = "Traitement…";
    result.innerHTML = "";

    const entries = Object.entries(cart);
    for (const [id, qty] of entries) {
      const p = products.find(x => x.id == id);
      try {
        const r = await fetch("/order", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ product: { id: parseInt(id, 10), quantity: qty } }),
        });
        const data = await r.json();
        const line = document.createElement("div");
        line.className = "line";
        if (r.ok && data.order) {
          line.innerHTML = `<span class="ok">✓ ${p.name} ×${qty}</span>
            <a href="/order/${data.order.id}" target="_blank">commande #${data.order.id}</a>`;
        } else {
          const code = data.errors ? Object.values(data.errors)[0].code : r.status;
          line.innerHTML = `<span class="ko">✗ ${p.name}</span><span class="ko">${code}</span>`;
        }
        result.appendChild(line);
      } catch (e) {
        const line = document.createElement("div");
        line.className = "line";
        line.innerHTML = `<span class="ko">✗ ${p.name}</span><span class="ko">erreur réseau</span>`;
        result.appendChild(line);
      }
    }

    cart = {};
    renderCart();
    btn.textContent = "Passer la commande";
    showToast("Commande(s) créée(s)");
  }

  loadProducts().then(renderCart);
</script>
</body>
</html>
